<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartQueue Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h2>SmartQueue Portal</h2>
        <p>Welcome! Select your department to join the queue.</p>
        
        <form method="POST">
            <label>Your Name:</label>
            <input type="text" name="customer_name" required placeholder="Enter your name">
            
            <label>Select Department:</label>
            <select name="department" required>
                <option value="Cash Deposit">Cash Deposit</option>
                <option value="Account Opening">Account Opening</option>
                <option value="Customer Inquiry">Customer Inquiry</option>
            </select>
            
            <button type="submit">Generate Token</button>
        </form>

        <hr style="margin: 20px 0;">
        
        <div style="text-align: center;">
            <a href="/track" style="margin-right: 15px;">📊 View Live Queue Status</a>
            <a href="/staff?key=mysecretstaffkey">🔐 Staff Console</a>
        </div>
    </div>
</body>
</html>
