<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff Console</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="portal-card" style="max-width: 650px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h2>Staff Console</h2>
                <p style="margin:0; font-size:13px; color:#6b7280;">Manage live active tokens</p>
            </div>
            <a href="/logout" style="background: #fee2e2; color: #991b1b; padding: 8px 12px; border-radius: 6px; text-decoration: none; font-size: 13px; font-weight: 600;">Logout</a>
        </div>
        
        {% if waiting %}
        <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
            <thead>
                <tr style="border-bottom: 2px solid #e5e7eb; text-align: left;">
                    <th style="padding: 10px;">Token</th>
                    <th style="padding: 10px;">Customer</th>
                    <th style="padding: 10px;">Department</th>
                    <th style="padding: 10px;">Wait Time</th>
                    <th style="padding: 10px;">Action</th>
                </tr>
            </thead>
            <tbody>
                {% for row in waiting %}
                <tr style="border-bottom: 1px solid #f3f4f6;">
                    <td style="padding: 12px; font-weight: bold; color: #4f46e5;">{{ row[1] }}</td>
                    <td style="padding: 12px;">{{ row[2] }}</td>
                    <td style="padding: 12px;">{{ row[3] }}</td>
                    <td style="padding: 12px; color: #d97706; font-weight: 600;">{{ row[4] }} mins</td>
                    <td style="padding: 12px;">
                        <a href="/complete/{{ row[0] }}" style="background: #10b981; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: 600;">Complete ✓</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p style="text-align: center; color: #6b7280; padding: 30px 0;">No active customers waiting in the queue.</p>
        {% endif %}
    </div>
</body>
</html>
