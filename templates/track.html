<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Queue Tracking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="portal-card" style="max-width: 500px;">
        <div class="brand-header">
            <h2>Live Queue Status</h2>
            <p>Real-time updates for all departments</p>
        </div>
        
        <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
            <thead>
                <tr style="border-bottom: 2px solid #e5e7eb; text-align: left;">
                    <th style="padding: 10px;">Department</th>
                    <th style="padding: 10px;">People Waiting</th>
                    <th style="padding: 10px;">Est. Wait Time</th>
                </tr>
            </thead>
            <tbody>
                {% for counter in counters %}
                <tr style="border-bottom: 1px solid #f3f4f6;">
                    <td style="padding: 12px; font-weight: 600;">{{ counter[0] }}</td>
                    <td style="padding: 12px; color: #4f46e5; font-weight: bold;">{{ counter[1] }} members</td>
                    <td style="padding: 12px; color: #6b7280;">~{{ counter[1] * 3 }} mins</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        
        <div style="text-align: center;">
            <a href="/" style="color: #4f46e5; text-decoration: none; font-weight: 600;">← Back to Home</a>
        </div>
    </div>
</body>
</html>
